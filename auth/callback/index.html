<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="callbackDescription" name="description" content="Callback público de Google OAuth para devolver al usuario a la cuenta segura de Zamazen Aegis sin almacenar tokens.">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="canonical" href="https://rydent.github.io/ZamazenAegis-Web/auth/callback">
  <title>Zamazen Aegis - Google OAuth callback</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #08100d;
      color: #f4f8f2;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(63, 185, 128, 0.18), transparent 32%),
        linear-gradient(145deg, #07100d 0%, #10201a 48%, #060908 100%);
    }

    main {
      width: min(100%, 520px);
      border: 1px solid rgba(185, 222, 200, 0.26);
      border-radius: 8px;
      padding: 28px;
      background: rgba(8, 16, 13, 0.82);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.36);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      line-height: 1.55;
      color: #dcebdd;
    }

    a {
      color: #9ee8bb;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main aria-live="polite">
    <h1>Google OAuth</h1>
    <p id="callbackStatus">Volviendo a Zamazen Aegis...</p>
    <a id="continueLink" href="../../index.html#/cuenta">Volver a la cuenta</a>
  </main>

  <script>
    (() => {
      "use strict";

      const GOOGLE_OAUTH_REDIRECT_URIS = Object.freeze({
        production: "https://rydent.github.io/ZamazenAegis-Web/auth/callback",
        development: "http://localhost:5173/auth/callback"
      });
      const SUPPORTED_CALLBACK_LANGUAGES = ["es", "en", "fr", "pt"];
      const CALLBACK_COPY = {
        es: {
          title: "Zamazen Aegis - Retorno de Google OAuth",
          description: "Retorno público de Google OAuth para volver a la cuenta segura de Zamazen Aegis sin almacenar tokens.",
          returning: "Volviendo a Zamazen Aegis...",
          continue: "Volver a la cuenta",
          error: "Google devolvió un error. Zamazen no ha creado ninguna sesión falsa.",
          code: "Retorno recibido. Zamazen volverá a la pantalla de cuenta para continuar de forma segura.",
          empty: "Retorno abierto sin datos de Google. Volviendo a la cuenta."
        },
        en: {
          title: "Zamazen Aegis - Google OAuth return",
          description: "Public Google OAuth return page that sends the user back to the secure Zamazen Aegis account without storing tokens.",
          returning: "Returning to Zamazen Aegis...",
          continue: "Return to the account",
          error: "Google returned an error. Zamazen did not create a fake session.",
          code: "Return received. Zamazen will go back to the account screen to continue safely.",
          empty: "Return opened without Google data. Going back to the account."
        },
        fr: {
          title: "Zamazen Aegis - Retour Google OAuth",
          description: "Page publique de retour Google OAuth qui renvoie l'utilisateur vers le compte sécurisé Zamazen Aegis sans stocker de jetons.",
          returning: "Retour vers Zamazen Aegis...",
          continue: "Revenir au compte",
          error: "Google a renvoyé une erreur. Zamazen n'a créé aucune fausse session.",
          code: "Retour reçu. Zamazen revient à l'écran du compte pour continuer en toute sécurité.",
          empty: "Retour ouvert sans données Google. Retour vers le compte."
        },
        pt: {
          title: "Zamazen Aegis - Retorno Google OAuth",
          description: "Página pública de retorno Google OAuth que leva o usuário de volta à conta segura Zamazen Aegis sem guardar tokens.",
          returning: "Voltando ao Zamazen Aegis...",
          continue: "Voltar à conta",
          error: "O Google devolveu um erro. O Zamazen não criou nenhuma sessão falsa.",
          code: "Retorno recebido. O Zamazen voltará à tela da conta para continuar com segurança.",
          empty: "Retorno aberto sem dados do Google. Voltando à conta."
        }
      };
      const params = new URLSearchParams(window.location.search || "");
      const error = params.get("error");
      const hasCode = params.has("code");
      const requestedLanguage = params.get("lang");
      let storedLanguage = "";
      try {
        storedLanguage = localStorage.getItem("lang") || "";
      } catch (storageError) {
        storedLanguage = "";
      }
      const browserLanguage = String(navigator.language || "es").slice(0, 2).toLowerCase();
      const language = [requestedLanguage, storedLanguage, browserLanguage]
        .find((candidate) => SUPPORTED_CALLBACK_LANGUAGES.includes(candidate)) || "es";
      const copy = CALLBACK_COPY[language];
      const isProjectPage = window.location.pathname.includes("/ZamazenAegis-Web/");
      const basePath = isProjectPage ? "/ZamazenAegis-Web/" : "/";
      const route = error ? "login" : "cuenta";
      const targetUrl = `${window.location.origin}${basePath}index.html?lang=${language}#/${route}`;
      const status = document.getElementById("callbackStatus");
      const continueLink = document.getElementById("continueLink");

      window.ZAMAZEN_GOOGLE_OAUTH_REDIRECT_URIS = GOOGLE_OAUTH_REDIRECT_URIS;

      document.documentElement.lang = language;
      document.title = copy.title;
      document.getElementById("callbackDescription").content = copy.description;

      if (continueLink) {
        continueLink.href = targetUrl;
        continueLink.textContent = copy.continue;
      }

      if (status) {
        if (error) {
          status.textContent = copy.error;
        } else if (hasCode) {
          status.textContent = copy.code;
        } else {
          status.textContent = copy.empty;
        }
      }

      window.setTimeout(() => {
        window.location.replace(targetUrl);
      }, 1600);
    })();
  </script>
</body>
</html>
